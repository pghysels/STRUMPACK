name: Run Github CI tests.

on: [push, pull_request]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        compiler:
          - gcc
        test: [0,1,2,3,4,5]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          export BLUE="\033[34;1m"
          mkdir -p installDir

          printf  "${BLUE} PG; Installing gcc via apt\n"
          sudo apt-get update
          sudo apt-get install build-essential software-properties-common -y
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install gcc g++ -y
          export CXX="g++"
          export CC="gcc"
          printf "${BLUE} PG; Done installing gcc via apt\n"

          printf "${BLUE} PG; Installing ccache via apt\n"
          sudo apt-get install ccache -y
          printf "${BLUE} PG; Done installing ccache via apt\n"

          printf "${BLUE} PG; Installing gfortran via apt\n"
          sudo apt-get install gfortran -y
          printf "${BLUE} PG; Done installing gfortran via apt\n"

          printf "${BLUE} PG; Installing openmpi\n"
          sudo apt-get install openmpi-bin libopenmpi-dev
          printf "${BLUE} PG; Done installing openmpi\n"

          printf "${BLUE} PG; Installing metis\n"
          sudo apt-get install libmetis-dev libparmetis-dev
          printf "${BLUE} PG; Done installing metis\n"

          printf "${BLUE} PG; Installing OpenBLAS from apt\n"
          sudo apt-get install libopenblas-openmp-dev
          printf "${BLUE} PG; Done installing OpenBLAS from apt\n"

          printf "${BLUE} PG; Installing ScaLAPACK from apt\n"
          sudo apt-get install libscalapack-mpi-dev
          printf "${BLUE} PG; Done installing ScaLAPACK from apt\n"

      # Compiler cache. A compiler cache only helps when its directory survives
      # from one build to the next. A developer building locally gets that for
      # free (ccache's directory persists between builds), but every CI job
      # starts on a fresh runner, so the cache has to be restored from a
      # persistent store and saved back afterwards. actions/cache is GitHub's
      # built-in store (10 GB per repository, LRU-evicted, no setup needed).
      - name: Restore ccache directory
        if: vars.USE_SCCACHE_S3 != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('CMakeLists.txt', 'src/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.compiler }}-

      # OPTIONAL remote store, DISABLED by default: sccache with an S3 bucket
      # instead of actions/cache, for when the GitHub cache is too small or a
      # cache should be shared across repositories/CI systems. This is
      # hypothetical infrastructure the project does not have today. To enable
      # it, create the bucket, set the repository variable USE_SCCACHE_S3=true
      # and add the secrets SCCACHE_BUCKET, SCCACHE_REGION, AWS_ACCESS_KEY_ID,
      # AWS_SECRET_ACCESS_KEY (they are exported as environment variables in
      # the build step below).
      - name: Set up sccache (optional S3 remote store, off by default)
        if: vars.USE_SCCACHE_S3 == 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Use sccache as the compiler launcher
        if: vars.USE_SCCACHE_S3 == 'true'
        run: echo "COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"

      - name: Install package
        env:
          # ccache: make cache entries independent of the checkout directory
          CCACHE_BASEDIR: ${{ github.workspace }}
          # sccache S3 remote (only used when USE_SCCACHE_S3 == 'true')
          SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
          SCCACHE_REGION: ${{ secrets.SCCACHE_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          export BLUE="\033[34;1m"
          printf "${BLUE} PG; Installing STRUMPACK from source\n"
          cd $GITHUB_WORKSPACE
          export CCACHE_DIR=$HOME/.cache/ccache
          LAUNCHER=${COMPILER_LAUNCHER:-ccache}
          $LAUNCHER --zero-stats
          rm -rf build
          mkdir -p build
          mkdir -p install
          cd build
          export CRAYPE_LINK_TYPE=dynamic
          cmake .. \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_C_COMPILER=mpicc \
            -DCMAKE_CXX_COMPILER=mpic++ \
            -DCMAKE_Fortran_COMPILER=mpif90 \
            -DCMAKE_C_COMPILER_LAUNCHER=$LAUNCHER \
            -DCMAKE_CXX_COMPILER_LAUNCHER=$LAUNCHER \
            -DCMAKE_Fortran_COMPILER_LAUNCHER=$LAUNCHER \
            -DCMAKE_INSTALL_PREFIX=../install \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTPL_SCALAPACK_LIBRARIES='/usr/lib/x86_64-linux-gnu/libscalapack-openmpi.so' \
            -DCMAKE_VERBOSE_MAKEFILE:BOOL=OFF
          make
          make install
          make examples
          printf "${BLUE} PG; Done installing STRUMPACK from source\n"
          $LAUNCHER --show-stats
          cd ../
          export STRUMPACK_DIR=`pwd`/install
          cd test/build_external/
          mkdir -p build
          cd build
          cmake ../
          make

      # Cache of the sparse test matrices (downloaded by
      # test/download_mtx.sh), since the download servers are often
      # unreachable. Restored after the build step, which wipes build/.
      # Only the jobs that use the matrices (3, 4, 5) need them.
      - name: Restore sparse test matrices
        if: matrix.test >= 3
        uses: actions/cache/restore@v4
        with:
          path: |
            build/test/utm300
            build/test/mesh3e1
            build/test/t2dal
            build/test/bcsstk28
            build/test/cavity16
            build/test/bcsstm08
            build/test/sherman4
            build/test/rdb968
            build/test/gemat11
          key: mtx-${{ hashFiles('test/download_mtx.sh') }}-
          restore-keys: |
            mtx-${{ hashFiles('test/download_mtx.sh') }}-

      - name: Test
        run: |
          cd $GITHUB_WORKSPACE
          export TEST_NUMBER=${{ matrix.test }}
          sh ./.ci_tests.sh

      # Save whatever matrices are available. The key contains the number
      # of matrices present, so a more complete set is saved under a new
      # key, and restored (most recent prefix match) by later runs. Only
      # valid (non-empty) matrices are present: download_mtx.sh removes
      # broken downloads.
      - name: Count sparse test matrices
        id: mtx
        if: always() && matrix.test >= 3
        run: |
          n=0
          for m in utm300 mesh3e1 t2dal bcsstk28 cavity16 bcsstm08 sherman4 rdb968 gemat11; do
            [ -s "build/test/$m/$m.mtx" ] && n=$((n + 1))
          done
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "$n test matrices available"
      - name: Save sparse test matrices
        if: always() && matrix.test >= 3 && steps.mtx.outputs.count != '0'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build/test/utm300
            build/test/mesh3e1
            build/test/t2dal
            build/test/bcsstk28
            build/test/cavity16
            build/test/bcsstm08
            build/test/sherman4
            build/test/rdb968
            build/test/gemat11
          key: mtx-${{ hashFiles('test/download_mtx.sh') }}-n${{ steps.mtx.outputs.count }}

      - name: External build
        run: |
          cd $GITHUB_WORKSPACE
          export STRUMPACK_DIR=`pwd`/install
          cd test/build_external/
          mkdir -p build
          cd build
          cmake ../
          make

  build-magma-no-mpi:
    # Compile-only check of the MAGMA (GPU) code path in a build without MPI,
    # a combination the test matrix above does not cover (see #156). No GPU is
    # needed: CUDA, cuBLAS/cuSOLVER and MAGMA come prebuilt from conda-forge,
    # and only the library is compiled (no tests or examples are run).
    name: Build with MAGMA, without MPI (compile only)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install CUDA toolkit, MAGMA, BLAS/LAPACK and METIS from conda-forge
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: strumpack-magma
          create-args: >-
            cuda-version=12.6
            cuda-nvcc cuda-cudart-dev libcublas-dev libcusolver-dev libcusparse-dev
            libmagma libmagma-devel
            libblas liblapack metis
            cmake make cxx-compiler fortran-compiler
          cache-environment: true

      - name: Configure (MPI off, CUDA and MAGMA on)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTRUMPACK_USE_MPI=OFF \
            -DSTRUMPACK_USE_OPENMP=ON \
            -DSTRUMPACK_USE_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=80 \
            -DTPL_ENABLE_MAGMA=ON \
            -DTPL_MAGMA_PREFIX=$CONDA_PREFIX \
            -DTPL_METIS_PREFIX=$CONDA_PREFIX \
            -DTPL_ENABLE_PARMETIS=OFF \
            -DTPL_ENABLE_SCOTCH=OFF \
            -DTPL_ENABLE_PTSCOTCH=OFF \
            -DTPL_ENABLE_BPACK=OFF \
            -DTPL_ENABLE_ZFP=OFF \
            -DTPL_ENABLE_SZ3=OFF \
            -DTPL_ENABLE_SLATE=OFF \
            -DTPL_ENABLE_COMBBLAS=OFF \
            -DTPL_ENABLE_KBLAS=OFF \
            -DTPL_ENABLE_PAPI=OFF

      - name: Check that MAGMA was found and enabled
        # STRUMPACK silently builds without MAGMA when it is not found
        run: grep -q '^#define STRUMPACK_USE_MAGMA' build/StrumpackConfig.h

      - name: Build library
        run: cmake --build build --target strumpack -j 4

  test-cuda-simulated-gpu:
    # Builds the CUDA code path (without MPI and without MAGMA) and runs the
    # sequential ctest suite on a simulated NVIDIA H100
    # (https://github.com/pantheongpu/pantheonsim), so no GPU is needed. With
    # CUDA enabled the dense and BLR fronts are factored by the kernels in
    # src/sparse/fronts/FrontCUDA.cu and FrontGPUSPD.cu and by cuBLAS/cuSOLVER,
    # and every test checks the residual of the solution. A simulator does not
    # reproduce hardware-specific behavior or timing, so this complements
    # testing on real GPUs and does not replace it.
    name: Build with CUDA and test on a simulated H100 (no MPI)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # library-path is off so that the toolkit's cuBLAS and cuSOLVER are the
      # ones STRUMPACK links against.
      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"
          library-path: 'false'

      - name: Install BLAS/LAPACK, METIS and gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenblas-openmp-dev libmetis-dev

      # The simulator runs PTX (90-virtual) and needs a shared CUDA runtime.
      - name: Configure (MPI off, CUDA on)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.0/bin/nvcc \
            -DCMAKE_CUDA_ARCHITECTURES=90-virtual \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared \
            -DSTRUMPACK_USE_MPI=OFF \
            -DSTRUMPACK_USE_OPENMP=ON \
            -DSTRUMPACK_USE_CUDA=ON \
            -DTPL_ENABLE_MAGMA=OFF \
            -DTPL_ENABLE_PARMETIS=OFF \
            -DTPL_ENABLE_SCOTCH=OFF \
            -DTPL_ENABLE_PTSCOTCH=OFF \
            -DTPL_ENABLE_BPACK=OFF \
            -DTPL_ENABLE_ZFP=OFF \
            -DTPL_ENABLE_SZ3=OFF \
            -DTPL_ENABLE_SLATE=OFF \
            -DTPL_ENABLE_COMBBLAS=OFF \
            -DTPL_ENABLE_KBLAS=OFF \
            -DTPL_ENABLE_PAPI=OFF

      - name: Build library and tests
        run: cmake --build build -j3

      # Same matrix cache as the test job above; the
      # Download_sparse_test_matrices fixture fetches what is missing and
      # tests whose matrix cannot be downloaded are skipped.
      - name: Restore sparse test matrices
        uses: actions/cache/restore@v4
        with:
          path: |
            build/test/utm300
            build/test/mesh3e1
            build/test/t2dal
            build/test/bcsstk28
            build/test/cavity16
            build/test/bcsstm08
            build/test/sherman4
            build/test/rdb968
            build/test/gemat11
          key: mtx-${{ hashFiles('test/download_mtx.sh') }}-
          restore-keys: |
            mtx-${{ hashFiles('test/download_mtx.sh') }}-

      # The five cavity16 cases are excluded: with OMP_NUM_THREADS=8 on this
      # 4-core runner their residual changes from run to run and is sometimes
      # above the test threshold, also on the CPU alone (--sp_disable_gpu,
      # without the simulator). With one thread they pass every time.
      - name: Test on the simulated H100
        run: |
          vgpu run ctest --test-dir build --output-on-failure --no-tests=error -j2 \
            -E '^(SPARSE_seq_(27|30|74|77)|SPARSE_BLR_seq_pivot_COLWISE_cavity16)$'
