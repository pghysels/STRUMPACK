name: Run Github CI tests.

on: [push, pull_request]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        compiler:
          - gcc
        test: [0,1,2,3,4,5]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: |
          export BLUE="\033[34;1m"
          mkdir -p installDir

          printf  "${BLUE} PG; Installing gcc via apt\n"
          sudo apt-get update
          sudo apt-get install build-essential software-properties-common -y
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install gcc g++ -y
          export CXX="g++"
          export CC="gcc"
          printf "${BLUE} PG; Done installing gcc via apt\n"

          printf "${BLUE} PG; Installing gfortran via apt\n"
          sudo apt-get install gfortran -y
          printf "${BLUE} PG; Done installing gfortran via apt\n"

          printf "${BLUE} PG; Installing openmpi\n"
          sudo apt-get install openmpi-bin libopenmpi-dev
          printf "${BLUE} PG; Done installing openmpi\n"

          printf "${BLUE} PG; Installing metis\n"
          sudo apt-get install libmetis-dev libparmetis-dev
          printf "${BLUE} PG; Done installing metis\n"

          printf "${BLUE} PG; Installing OpenBLAS from apt\n"
          sudo apt-get install libopenblas-openmp-dev
          printf "${BLUE} PG; Done installing OpenBLAS from apt\n"

          printf "${BLUE} PG; Installing ScaLAPACK from apt\n"
          sudo apt-get install libscalapack-mpi-dev
          printf "${BLUE} PG; Done installing ScaLAPACK from apt\n"

      - name: Install package
        run: |
          export BLUE="\033[34;1m"
          printf "${BLUE} PG; Installing STRUMPACK from source\n"
          cd $GITHUB_WORKSPACE
          rm -rf build
          mkdir -p build
          mkdir -p install
          cd build
          export CRAYPE_LINK_TYPE=dynamic
          cmake .. \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_C_COMPILER=mpicc \
            -DCMAKE_CXX_COMPILER=mpic++ \
            -DCMAKE_Fortran_COMPILER=mpif90 \
            -DCMAKE_INSTALL_PREFIX=../install \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTPL_SCALAPACK_LIBRARIES='/usr/lib/x86_64-linux-gnu/libscalapack-openmpi.so' \
            -DCMAKE_VERBOSE_MAKEFILE:BOOL=OFF
          make
          make install
          make examples
          printf "${BLUE} PG; Done installing STRUMPACK from source\n"
          cd ../
          export STRUMPACK_DIR=`pwd`/install
          cd test/build_external/
          mkdir -p build
          cd build
          cmake ../
          make

      - name: Test
        run: |
          cd $GITHUB_WORKSPACE
          export TEST_NUMBER=${{ matrix.test }}
          sh ./.ci_tests.sh

      - name: External build
        run: |
          cd $GITHUB_WORKSPACE
          export STRUMPACK_DIR=`pwd`/install
          cd test/build_external/
          mkdir -p build
          cd build
          cmake ../
          make

  build-magma-no-mpi:
    # Compile-only check of the MAGMA (GPU) code path in a build without MPI,
    # a combination the test matrix above does not cover (see #156). No GPU is
    # needed: CUDA, cuBLAS/cuSOLVER and MAGMA come prebuilt from conda-forge,
    # and only the library is compiled (no tests or examples are run).
    name: Build with MAGMA, without MPI (compile only)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CUDA toolkit, MAGMA, BLAS/LAPACK and METIS from conda-forge
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: strumpack-magma
          create-args: >-
            cuda-version=12.6
            cuda-nvcc cuda-cudart-dev libcublas-dev libcusolver-dev libcusparse-dev
            libmagma libmagma-devel
            libblas liblapack metis
            cmake make cxx-compiler fortran-compiler
          cache-environment: true

      - name: Configure (MPI off, CUDA and MAGMA on)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTRUMPACK_USE_MPI=OFF \
            -DSTRUMPACK_USE_OPENMP=ON \
            -DSTRUMPACK_USE_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=80 \
            -DTPL_ENABLE_MAGMA=ON \
            -DTPL_MAGMA_PREFIX=$CONDA_PREFIX \
            -DTPL_METIS_PREFIX=$CONDA_PREFIX \
            -DTPL_ENABLE_PARMETIS=OFF \
            -DTPL_ENABLE_SCOTCH=OFF \
            -DTPL_ENABLE_PTSCOTCH=OFF \
            -DTPL_ENABLE_BPACK=OFF \
            -DTPL_ENABLE_ZFP=OFF \
            -DTPL_ENABLE_SZ3=OFF \
            -DTPL_ENABLE_SLATE=OFF \
            -DTPL_ENABLE_COMBBLAS=OFF \
            -DTPL_ENABLE_KBLAS=OFF \
            -DTPL_ENABLE_PAPI=OFF

      - name: Check that MAGMA was found and enabled
        # STRUMPACK silently builds without MAGMA when it is not found
        run: grep -q '^#define STRUMPACK_USE_MAGMA' build/StrumpackConfig.h

      - name: Build library
        run: cmake --build build --target strumpack -j 4
