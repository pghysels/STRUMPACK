name: Run Github CI tests.

on: [push, pull_request]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
        test: [0,1,2,3,4,5]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Cache sparse test matrices
        if: matrix.test >= 3
        uses: actions/cache@v5
        with:
          path: ~/.cache/strumpack/test_matrices.tar.gz
          key: strumpack-test-matrices-${{ hashFiles('.ci_tests.sh') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc g++ gfortran \
            openmpi-bin libopenmpi-dev libmetis-dev libparmetis-dev \
            libopenblas-openmp-dev libscalapack-mpi-dev

      - name: Install package
        run: |
          export BLUE="\033[34;1m"
          printf "${BLUE} PG; Installing STRUMPACK from source\n"
          cd $GITHUB_WORKSPACE
          rm -rf build
          mkdir -p build
          mkdir -p install
          cd build
          export CRAYPE_LINK_TYPE=dynamic
          cmake .. \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_C_COMPILER=mpicc \
            -DCMAKE_CXX_COMPILER=mpic++ \
            -DCMAKE_Fortran_COMPILER=mpif90 \
            -DCMAKE_INSTALL_PREFIX=../install \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTPL_SCALAPACK_LIBRARIES='/usr/lib/x86_64-linux-gnu/libscalapack-openmpi.so' \
            -DCMAKE_VERBOSE_MAKEFILE:BOOL=OFF
          make
          make install
          make examples
          printf "${BLUE} PG; Done installing STRUMPACK from source\n"
          cd ../
          export STRUMPACK_DIR=`pwd`/install
          cd test/build_external/
          mkdir -p build
          cd build
          cmake ../
          make

      - name: Test
        run: |
          cd $GITHUB_WORKSPACE
          export TEST_NUMBER=${{ matrix.test }}
          sh ./.ci_tests.sh

      - name: External build
        run: |
          cd $GITHUB_WORKSPACE
          export STRUMPACK_DIR=`pwd`/install
          cd test/build_external/
          mkdir -p build
          cd build
          cmake ../
          make
